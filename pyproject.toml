[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.1.0"
description = "私人管家 AI Agent：长期记忆 + 笔记知识库 + 可扩展技能"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.4",
    "mem0ai>=0.1",
    "lancedb>=0.9",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = [
    # 精确锁定：FastAPI 0.116+/Starlette 1.x 移除了 on_startup，会崩溃
    "fastapi==0.115.6",
    "starlette==0.41.3",
    # factory 模式（workers/reload 需要）自 0.30 起可用
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.scripts]
alfred = "alfred.cli:app"

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.setuptools.package-data]
# 内置 skill 随包分发（bundled/<name>/SKILL.md）
"alfred.skills" = ["bundled/*/SKILL.md"]
# Web 前端静态文件
"alfred.webui" = ["**/*"]
